- hosts: localhost
  connection: local
  gather_facts: no
  become: no
  environment:
    HOMEBREW_CASK_OPTS: "--appdir=/Applications"
  roles:
    # - fonts
    - homebrew
    - homebrew-cask
    # - ruby-build
    - nodebrew
    - mas
  vars:
    home_dir: "{{ lookup('env', 'HOME') }}"
